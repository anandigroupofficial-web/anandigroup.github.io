<!-- SHG Community Bank Authentication Section -->
<div class="shg-login-card">
    <div class="shg-header">
        <span class="shg-icon">🏛️</span>
        <h2>Anandi SHG Member Portal</h2>
        <p>Enter your credentials to access your Digital Passbook & Savings Ledger</p>
    </div>

    <!-- Toggle between Member & Admin Login -->
    <div class="role-toggle">
        <button id="btn-role-member" class="role-btn active" onclick="switchLoginRole('member')">Member Login</button>
        <button id="btn-role-admin" class="role-btn" onclick="switchLoginRole('admin')">Admin Access</button>
    </div>

    <form id="shg-auth-form" onsubmit="handleSHGLogin(event)">
        <div class="form-group">
            <label id="lbl-identifier">Mobile Number / Member ID</label>
            <input type="text" id="shg-identifier" class="form-control" placeholder="Enter registered phone or ID" required>
        </div>

        <div class="form-group">
            <label>Password / Security PIN</label>
            <input type="password" id="shg-password" class="form-control" placeholder="Enter PIN or password" required>
        </div>

        <button type="submit" class="book-now-btn" style="margin-top: 10px;">Login to Passbook 🔐</button>
    </form>

    <div id="login-status" style="margin-top: 15px; text-align: center; font-size: 0.9rem; font-weight: 600;"></div>
</div>

<style>
    .shg-login-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 35px 30px;
        max-width: 480px;
        margin: 40px auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2dcd0;
    }

    .shg-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .shg-icon {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 8px;
    }

    .shg-header h2 {
        color: #2b5b84;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .shg-header p {
        color: #64748b;
        font-size: 0.85rem;
        line-height: 1.4;
    }

    .role-toggle {
        display: flex;
        background: #f1f5f9;
        border-radius: 8px;
        padding: 4px;
        margin-bottom: 20px;
    }

    .role-btn {
        flex: 1;
        padding: 10px;
        border: none;
        background: transparent;
        font-weight: 700;
        font-size: 0.85rem;
        color: #64748b;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .role-btn.active {
        background: #2b5b84;
        color: #ffffff;
    }
</style>

<script>
    var currentRole = "member";

    function switchLoginRole(role) {
        currentRole = role;
        document.getElementById("btn-role-member").classList.toggle("active", role === 'member');
        document.getElementById("btn-role-admin").classList.toggle("active", role === 'admin');

        if (role === 'admin') {
            document.getElementById("lbl-identifier").innerText = "Admin Username / Email";
            document.getElementById("shg-identifier").placeholder = "Enter admin username";
        } else {
            document.getElementById("lbl-identifier").innerText = "Mobile Number / Member ID";
            document.getElementById("shg-identifier").placeholder = "Enter registered phone or ID";
        }
    }

    function handleSHGLogin(event) {
        event.preventDefault();
        var id = document.getElementById("shg-identifier").value.trim();
        var pass = document.getElementById("shg-password").value;
        var status = document.getElementById("login-status");

        status.style.color = "#2b5b84";
        status.innerText = "Authenticating " + currentRole + "...";

        // Next step: Connect to backend database (Supabase / Firebase Auth)
    }
</script>
