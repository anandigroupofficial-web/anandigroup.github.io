<!-- SHG Community Bank Member Login Section -->
<div class="shg-login-card">
    <div class="shg-header">
        <!-- Secret trigger: Double-click the icon to reveal Admin Login -->
        <span class="shg-icon" title="SHG Portal" ondblclick="enableAdminMode()">🏛️</span>
        <h2 id="shg-title">SHG Member Passbook</h2>
        <p id="shg-subtitle">Enter your Mobile Number and Security PIN to view your savings and loan ledger.</p>
    </div>

    <form id="shg-auth-form" onsubmit="handleSHGLogin(event)">
        <div class="form-group">
            <label id="lbl-identifier">Mobile Number / Member ID</label>
            <input type="text" id="shg-identifier" class="form-control" placeholder="Enter 10-digit mobile number or ID" required>
        </div>

        <div class="form-group">
            <label id="lbl-password">Security PIN / Password</label>
            <input type="password" id="shg-password" class="form-control" placeholder="Enter PIN" required>
        </div>

        <button type="submit" id="shg-submit-btn" class="book-now-btn" style="margin-top: 10px;">View Passbook 🔐</button>
    </form>

    <div id="login-status" style="margin-top: 15px; text-align: center; font-size: 0.9rem; font-weight: 600;"></div>
</div>

<style>
    .shg-login-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 35px 30px;
        max-width: 480px;
        margin: 40px auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2dcd0;
    }

    .shg-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .shg-icon {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
    }

    .shg-header h2 {
        color: #2b5b84;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .shg-header p {
        color: #64748b;
        font-size: 0.85rem;
        line-height: 1.4;
    }
</style>

<script>
    var currentRole = "member";

    // Auto-check if URL has ?admin=true secret parameter
    window.addEventListener('DOMContentLoaded', function() {
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            enableAdminMode();
        }
    });

    // Hidden trigger to switch to Admin mode
    function enableAdminMode() {
        currentRole = "admin";
        document.getElementById("shg-title").innerText = "SHG Master Admin Portal";
        document.getElementById("shg-subtitle").innerText = "Enter Admin credentials to manage ledger & record transactions.";
        document.getElementById("lbl-identifier").innerText = "Admin Username / Email";
        document.getElementById("shg-identifier").placeholder = "Enter admin username";
        document.getElementById("shg-submit-btn").innerText = "Access Master Ledger 🔑";
        
        var status = document.getElementById("login-status");
        status.style.color = "#0284c7";
        status.innerText = "🔒 Admin mode activated.";
    }

    function handleSHGLogin(event) {
        event.preventDefault();
        var id = document.getElementById("shg-identifier").value.trim();
        var pass = document.getElementById("shg-password").value;
        var status = document.getElementById("login-status");

        status.style.color = "#2b5b84";
        status.innerText = "Authenticating " + currentRole + "...";

        // Next Step: Verify credentials with backend database
    }
</script>
